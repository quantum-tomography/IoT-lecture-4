<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understanding the Mirai Botnet — Interactive Lecture</title><style>*{box-sizing:border-box}body{margin:0;background:#070e1d;color:#eaf2ff;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 10%,#16365a 0,transparent 42%),#080f1f}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 30px;border-bottom:1px solid #263955}.brand{font-size:13px;letter-spacing:2px;color:#73d9ff;font-weight:800}.counter{color:#b7c8dd;font-size:14px}.progress{height:4px;background:#1b2b45}.fill{height:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width .3s}.slide{flex:1;display:none;align-items:center;justify-content:center;padding:28px 5vw;overflow:auto}.slide.active{display:flex;animation:rise .4s ease}.content{width:min(1100px,100%)}.kicker{color:#56d8ff;letter-spacing:3px;text-transform:uppercase;font-size:13px;font-weight:800}h1{font-size:clamp(34px,5vw,64px);line-height:1.08;margin:14px 0 20px}p.lead{font-size:clamp(18px,2.1vw,25px);line-height:1.5;color:#c2d2e8;max-width:950px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}.panel{background:#111f35;border:1px solid #2a4665;border-radius:20px;padding:24px;box-shadow:0 15px 45px #0003}.tilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{border:1px solid #345373;background:#142741;border-radius:15px;padding:19px;font-size:19px}.tile b{color:#67e8f9}.visual{min-height:270px;display:flex;align-items:center;justify-content:center}.bigicon{font-size:125px;filter:drop-shadow(0 0 25px #20d5ff55)}.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.node{background:#173650;border:1px solid #4ca5d0;border-radius:14px;padding:16px 12px;text-align:center;min-width:105px}.arrow{color:#56e3ff;font-size:27px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.steps .node{min-height:145px;display:flex;align-items:center;justify-content:center}.barrow{display:flex;gap:12px;align-items:center;margin:14px 0}.barlabel{width:180px;font-size:15px}.barbg{flex:1;background:#233750;height:25px;border-radius:8px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#0891b2,#8b5cf6);border-radius:8px;animation:grow .9s ease}.barval{width:78px;text-align:right;color:#a5f3fc}.quizopts{display:grid;gap:13px;margin-top:24px}.opt{background:#162b46;border:1px solid #39577c;color:#eaf2ff;border-radius:13px;padding:17px;text-align:left;font-size:18px;cursor:pointer;transition:.2s}.opt:hover{background:#214469;transform:translateX(4px)}.opt.good{background:#145c4a;border-color:#34d399}.opt.bad{background:#64303c;border-color:#fb7185}.feedback{margin-top:17px;min-height:65px;color:#a9f6d6;font-size:17px;line-height:1.5}.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 30px;border-top:1px solid #263955;gap:12px}.controls{display:flex;gap:10px}button.nav{border:1px solid #40617f;border-radius:10px;padding:10px 19px;color:white;background:#172a45;cursor:pointer;font-weight:700}button.nav.primary{background:#117da2;border-color:#18b6dc}.source{color:#8ca4bf;font-size:11px;max-width:690px}.callout{border-left:4px solid #22d3ee;padding:12px 18px;background:#112a42;border-radius:0 10px 10px 0;margin-top:20px;color:#d5e6f7}.glow{animation:pulse 2.5s infinite}.confetti{position:fixed;z-index:99;pointer-events:none;top:-15px;width:9px;height:16px;animation:fall 4.2s linear forwards}.spark{position:fixed;z-index:100;pointer-events:none;width:6px;height:6px;border-radius:50%;animation:blast 1.8s ease-out forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(900deg);opacity:.2}}@keyframes blast{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}}@keyframes pulse{50%{filter:drop-shadow(0 0 35px #22d3ee)}}@media(max-width:780px){.layout{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.visual{min-height:120px}.bigicon{font-size:70px}.slide{padding:16px 5vw}.source{display:none}h1{font-size:34px}.tile{font-size:16px}}</style><style>.paperlink{color:#8ceaff;text-decoration:underline;text-underline-offset:3px}.glossbtn{background:#183b58;color:#dff8ff;border:1px solid #4d8eb4;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:700}.glossary{position:fixed;inset:0;z-index:500;background:#020712d9;display:none;align-items:center;justify-content:center;padding:22px}.glossary.open{display:flex}.glossbox{background:#101f35;border:1px solid #4d7596;border-radius:20px;width:min(920px,100%);max-height:88vh;display:flex;flex-direction:column;padding:24px;box-shadow:0 30px 100px #000a}.glosshead{display:flex;align-items:center;justify-content:space-between;gap:12px}.glosshead h2{margin:0;font-size:28px}.glosssearch{margin:16px 0;background:#09182b;border:1px solid #42617c;color:white;border-radius:10px;padding:12px;font-size:17px}.glosslist{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.glossentry{background:#152c45;border:1px solid #345575;border-radius:12px;padding:15px;line-height:1.45}.glossentry strong{display:block;color:#6fe2ff;margin-bottom:6px}.glossentry p{margin:0;color:#d7e4f5}.glossclose{font-size:22px}@media(max-width:650px){.glosslist{grid-template-columns:1fr}.glossbox{padding:14px}.source{font-size:11px}}</style></head><body><div id="app"><div class="top"><div class="brand">CYBERSECURITY · INTERACTIVE LECTURE</div><div style="display:flex;align-items:center;gap:12px"><button class="glossbtn" id="openGloss" type="button">📖 Glossary (18)</button><div class="counter" id="count"></div></div></div><div class="progress"><div class="fill" id="fill"></div></div><main id="slides" style="flex:1;min-height:0;display:flex"></main><footer class="foot"><div class="source">Source: <a class="paperlink" href="https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf" target="_blank" rel="noopener noreferrer">Antonakakis et al., “Understanding the Mirai Botnet” (USENIX 2017) ↗</a>. Statistics describe the 2016–17 study period.</div><div class="controls"><button class="nav" id="prev">← Back</button><button class="nav primary" id="next">Next →</button></div></footer></div><div class="glossary" id="glossary" role="dialog" aria-modal="true" aria-label="Mirai glossary"><div class="glossbox"><div class="glosshead"><h2>📖 Mirai glossary · 18 terms</h2><button class="glossbtn glossclose" id="closeGloss" aria-label="Close glossary">×</button></div><input class="glosssearch" id="glossSearch" placeholder="Search terms or explanations…" aria-label="Search glossary"><div class="glosslist" id="glossList"></div></div></div><script>const TERMS=[["DDoS", "Distributed Denial of Service: many devices flood a target with traffic so legitimate users cannot access it."], ["Worm-like", "Malware that spreads from one vulnerable device to another, often without a person installing it."], ["Malware", "Software designed to harm, disrupt, spy on, or take unauthorized control of systems."], ["Embedded device", "A computer built into a product for a particular job, such as a camera or router."], ["DVR", "Digital Video Recorder: a device that records video, often from surveillance cameras."], ["Krebs on Security", "Brian Krebs’s cybersecurity news website, targeted by a major Mirai DDoS attack in September 2016."], ["Dyn attack", "October 21, 2016 DDoS attack against Dyn, a DNS provider; it disrupted access to many websites."], ["CWMP", "CPE WAN Management Protocol: a protocol used by providers to remotely configure and manage routers and modems."], ["Loader", "A separate Mirai component that logs into a discovered vulnerable device and installs the appropriate malware."], ["IoT bot", "An Internet-connected device infected with malware and remotely controlled as part of a botnet."], ["C2 server", "Command-and-control server: infrastructure that sends instructions to infected bots."], ["Telnet", "An older remote-login protocol, commonly using TCP port 23; standard Telnet does not encrypt its traffic."], ["Zero-day", "A software vulnerability unknown to the vendor or without an available fix when exploited; Mirai’s original default-password attacks were not zero-days."], ["DNS", "Domain Name System: translates names such as example.com into IP addresses used by computers."], ["Network telescope", "A large collection of IP addresses monitored to observe unsolicited traffic, such as Internet-wide malware scans."], ["Censys banners", "Service-identification information collected by Censys Internet scans, used to infer device types, vendors, or software."], ["OVH", "A hosting and cloud infrastructure provider attacked by Mirai in September 2016."], ["Lonestar Cell", "A mobile telecommunications operator in Liberia targeted by Mirai-related DDoS attacks in late 2016."]];const DATA=[["Understanding the Mirai Botnet", "How ordinary IoT devices became a global DDoS weapon", "hero", null], ["What is Mirai?", "Mirai is a worm-like malware family that infected IoT and embedded devices, organizing them into a remotely controlled DDoS botnet.", "definition", {"terms": ["Worm-like = spreads to more devices", "Bot = compromised device", "Botnet = many bots under coordinated control"]}], ["Why IoT devices?", "Internet-connected cameras, DVRs, and routers often exposed remote administration services and used weak default credentials.", "devices", {"items": ["IP cameras", "DVR recorders", "Home routers", "Other embedded devices"]}], ["Mirai in 2016: the timeline", "A rapid outbreak escalated into attacks against major Internet services.", "timeline", {"items": ["Aug 1 · first observed scan", "Sep 21 · Krebs on Security", "Sep 30 · source code released", "Oct 21 · Dyn attacks", "Nov 26 · CWMP variant emerges"]}], ["Anatomy of the botnet", "The infected devices did not act alone: scanning, reporting, loading, command and control, and attacks were separate functions.", "network", null], ["How infection worked", "Original Mirai scanned for exposed Telnet services, tried a short built-in credential dictionary, reported successful logins, and relied on a separate loader to install malware.", "steps", {"items": ["1 · Scan for exposed Telnet (23 / 2323)", "2 · Try weak/default login pairs", "3 · Report accessible device", "4 · Loader installs matching binary", "5 · Bot scans and awaits C2 instructions"]}], ["Knowledge check 1", "What weakness was central to the original Mirai outbreak?", "quiz", {"q": "What was the main initial entry point?", "a": ["A sophisticated zero-day in every camera", "Exposed Telnet and weak/default credentials", "Infected email attachments"], "correct": 1, "why": "The original released Mirai primarily relied on exposed Telnet and a dictionary of credentials. Later variants added exploits."}], ["Explosive early growth", "Mirai reached about 64,500 infected devices in its first 20 hours. Its initial steady-state population was roughly 200,000–300,000.", "growth", {"items": ["64,500 · first 20 hours", "200k–300k · initial steady state", "~600k · late-November peak", "~100k · February 2017"]}], ["Where were the bots?", "On September 21, 2016, Brazil, Colombia and Vietnam together accounted for 41.5% of observed infections.", "geo", {"items": ["Brazil · 15.0%", "Colombia · 14.0%", "Vietnam · 12.5%", "All other locations · 58.5%"]}], ["How did researchers know?", "Researchers combined several independent data sources rather than relying on a single malware sample.", "methods", {"items": ["Network telescope · scanning patterns", "Censys banners · device clues", "Telnet honeypots · malware samples", "DNS data · C2 infrastructure", "Attack commands and victim logs · DDoS activity"]}], ["Knowledge check 2", "A network telescope helped reveal Mirai’s spread.", "quiz", {"q": "What does a network telescope primarily observe?", "a": ["Traffic arriving at monitored unused IP space", "Passwords stored in every router", "The content of all encrypted Internet messages"], "correct": 0, "why": "Unexpected probes to monitored address space can reveal widespread scanning. The researchers used a distinctive Mirai probe fingerprint."}], ["DDoS: many small devices, one large attack", "A DDoS attack overwhelms a target with traffic or requests from many sources. Mirai launched different kinds of floods.", "ddos", {"items": ["Volumetric · overload bandwidth", "TCP state exhaustion · exhaust connection handling", "Application-layer · overwhelm services"]}], ["The victims and the impact", "The study reconstructed 15,194 attacks against 5,046 victims, including game services, telecoms, and infrastructure providers.", "attacks", {"items": ["Krebs on Security · >600 Gbps reported", "OVH · September 2016", "Dyn · October 2016", "Lonestar Cell · repeated attacks", "Gaming services · frequent targets"]}], ["Knowledge check 3", "What makes a botnet dangerous?", "quiz", {"q": "Why can thousands of low-powered devices cause major disruption?", "a": ["Each device must be a supercomputer", "Their traffic is coordinated and accumulates", "They physically destroy the DNS servers"], "correct": 1, "why": "The combined traffic or requests from a large number of modest devices can overwhelm a service."}], ["Defend the next generation of IoT", "Mirai succeeded largely because basic security practices were missing. Apply layered protection and check your understanding.", "defense", {"items": ["Replace shared default passwords with unique credentials", "Disable unnecessary remote access and exposed ports", "Install trusted firmware/security updates", "Isolate IoT devices on a segmented network", "Monitor suspicious outbound traffic", "Demand secure-by-default design and update support"]}]];const slides=DATA;let current=0;let answered={};const root=document.getElementById('slides');const icons={hero:'🌐',definition:'🕸️',devices:'📷',timeline:'📅',network:'🧠',steps:'🔎',growth:'📈',geo:'🌍',methods:'🔬',ddos:'🌊',attacks:'⚠️',defense:'🛡️'};function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function renderBody(s,i){let [title,lead,type,data]=s;if(type==='quiz')return `<div class="panel"><div class="kicker">Interactive challenge</div><h2>${esc(data.q)}</h2><div class="quizopts">${data.a.map((a,j)=>`<button class="opt" id="opt-${i}-${j}" onclick="answer(${i},${j})">${String.fromCharCode(65+j)}. ${esc(a)}</button>`).join('')}</div><div class="feedback" id="feedback-${i}"></div></div>`;if(type==='network')return `<div class="panel"><div class="chain"><div class="node">📷<br>IoT bot</div><div class="arrow">→</div><div class="node">📡<br>Report server</div><div class="arrow">→</div><div class="node">📦<br>Loader</div></div><div class="chain" style="margin-top:20px"><div class="node">🎮<br>Attacker</div><div class="arrow">→</div><div class="node">🖥️<br>C2 server</div><div class="arrow">→</div><div class="node">📷 📹 📡<br>Bot swarm</div><div class="arrow">→</div><div class="node">🌐<br>DDoS target</div></div><div class="callout">Simplified schematic based on Figure 2 of the paper. A bot can scan for more victims while receiving attack commands.</div></div>`;if(type==='growth'||type==='geo'){let vals=type==='geo'?[15,14,12.5,58.5]:[64500,250000,600000,100000];return `<div class="panel">${data.items.map((t,j)=>`<div class="barrow"><div class="barlabel">${esc(t.split(' · ')[0])}</div><div class="barbg"><div class="bar" style="width:${vals[j]/Math.max(...vals)*100}%"></div></div><div class="barval">${type==='geo'?vals[j]+'%':''}</div></div>`).join('')}<div class="callout">${type==='growth'?'Figures represent different moments, not cumulative totals.':'Snapshot of observed infections on September 21, 2016.'}</div></div>`}if(type==='steps')return `<div class="steps">${data.items.map(x=>`<div class="node">${esc(x)}</div>`).join('')}</div>`;if(type==='timeline')return `<div class="panel"><div class="chain">${data.items.map((x,j)=>`<div class="node" style="min-width:165px;flex:1">${esc(x)}</div>${j<4?'<div class="arrow">→</div>':''}`).join('')}</div></div>`;if(type==='ddos')return `<div class="panel"><div class="chain"><div class="node">📷<br>Bot 1</div><div class="node">📹<br>Bot 2</div><div class="node">📡<br>Bot 3</div><div class="arrow">➜➜➜</div><div class="node glow">🌐<br>Overloaded service</div></div><div class="tilegrid" style="margin-top:20px">${data.items.map(x=>`<div class="tile">${esc(x)}</div>`).join('')}</div></div>`;if(data&&data.items){return `<div class="layout"><div class="panel"><div class="tilegrid">${data.items.map((x,j)=>`<div class="tile"><b>${String(j+1).padStart(2,'0')}</b><div style="margin-top:10px">${esc(x)}</div></div>`).join('')}</div></div><div class="visual"><div class="bigicon glow">${icons[type]||'🔐'}</div></div></div>`}return `<div class="layout"><div class="panel"><div class="bigicon glow" style="text-align:center">${icons[type]}</div></div><div class="panel"><h2>${type==='hero'?'A real-world cybersecurity case study':'The essential idea'}</h2><p class="lead">${type==='hero'?'Based on the 2017 USENIX Security paper by Antonakakis et al.': 'A large collection of simple, poorly secured devices can become a powerful coordinated threat.'}</p></div></div>`}slides.forEach((s,i)=>{let d=document.createElement('section');d.className='slide';d.innerHTML=`<div class="content"><div class="kicker">${i===0?'Case study · USENIX Security 2017':`Slide ${i+1} of 15`}</div><h1>${esc(s[0])}</h1><p class="lead">${esc(s[1])}</p>${renderBody(s,i)}</div>`;root.appendChild(d)});function go(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===current));document.getElementById('count').textContent=`${current+1} / ${slides.length}`;document.getElementById('fill').style.width=(current+1)/slides.length*100+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===14?'Finish ✓':'Next →'}function answer(i,j){if(answered[i])return;let d=slides[i][3],ok=j===d.correct;document.getElementById(`opt-${i}-${j}`).classList.add(ok?'good':'bad');if(!ok)document.getElementById(`opt-${i}-${d.correct}`).classList.add('good');document.getElementById(`feedback-${i}`).innerHTML=`<b>${ok?'✓ Correct!':'Not quite.'}</b> ${esc(d.why)}`;answered[i]=true;if(ok){[0,650,1300].forEach(t=>setTimeout(confetti,t));setTimeout(fireworks,2300)}}function confetti(){for(let i=0;i<115;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#22d3ee','#fbbf24','#f472b6','#a78bfa','#34d399'][i%5];e.style.setProperty('--dx',(Math.random()*200-100)+'px');e.style.animationDuration=(3.4+Math.random()*2)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5600)}}function fireworks(){for(let k=0;k<8;k++){let cx=10+Math.random()*80,cy=15+Math.random()*55;for(let j=0;j<55;j++){let e=document.createElement('div');e.className='spark';e.style.left=cx+'vw';e.style.top=cy+'vh';e.style.background=['#fff','#22d3ee','#facc15','#fb7185','#a78bfa'][j%5];let a=j/55*Math.PI*2,r=70+Math.random()*160;e.style.setProperty('--x',Math.cos(a)*r+'px');e.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}}}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});go(0);;(()=>{const terms=TERMS,modal=document.getElementById('glossary'),list=document.getElementById('glossList'),search=document.getElementById('glossSearch');function render(){const q=search.value.toLowerCase().trim();list.replaceChildren();for(const [term,desc] of terms){if(!(term+' '+desc).toLowerCase().includes(q))continue;const card=document.createElement('div');card.className='glossentry';const h=document.createElement('strong');h.textContent=term;const d=document.createElement('p');d.textContent=desc;card.append(h,d);list.append(card)}}document.getElementById('openGloss').addEventListener('click',()=>{modal.classList.add('open');render();search.focus()});document.getElementById('closeGloss').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});search.addEventListener('input',render);document.addEventListener('keydown',e=>{if(modal.classList.contains('open')){if(e.key==='Escape'){modal.classList.remove('open')}e.stopImmediatePropagation()}},true);render()})();</script><style>
.glosslink{color:#67e8f9;border-bottom:1px dashed #67e8f9;cursor:pointer;border-radius:2px;outline-offset:3px}
.glosslink:hover,.glosslink:focus{color:#fff;background:#155e75}
.glossentry.focused{border:2px solid #22d3ee;background:#12334b}
</style><script>
(()=>{
 const entries=TERMS.map(([term,desc])=>({term,desc}));
 const aliases={'worm-like':'Worm-like','worm like':'Worm-like','malware':'Malware','embedded devices':'Embedded device','embedded device':'Embedded device','iot bots':'IoT bot','iot bot':'IoT bot','c2 servers':'C2 server','c2 server':'C2 server','command-and-control':'C2 server','krebs on security':'Krebs on Security','krebs':'Krebs on Security','dyn attack':'Dyn attack','dyn':'Dyn attack','censys banners':'Censys banners','network telescope':'Network telescope','lonestar cell':'Lonestar Cell','zero-day':'Zero-day'};
 for(const [term] of TERMS)aliases[term.toLowerCase()]=term;
 const keys=Object.keys(aliases).sort((a,b)=>b.length-a.length);
 const pattern=new RegExp('(?<![\\w])(?:'+keys.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w])','gi');
 function decorate(){
  const walker=document.createTreeWalker(document.getElementById('app'),NodeFilter.SHOW_TEXT,{acceptNode(node){return node.parentElement.closest('button,a,script,style,.glosslink')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){const text=node.nodeValue;pattern.lastIndex=0;if(!pattern.test(text))continue;pattern.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=pattern.exec(text))){frag.append(document.createTextNode(text.slice(last,m.index)));const b=document.createElement('span');b.className='glosslink';b.tabIndex=0;b.setAttribute('role','button');b.title='Click for glossary definition';b.dataset.term=aliases[m[0].toLowerCase()];b.textContent=m[0];frag.append(b);last=pattern.lastIndex;}frag.append(document.createTextNode(text.slice(last)));node.replaceWith(frag)}
 }
 decorate();
 document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('.glosslink');if(b)openTerm(b.dataset.term)});
 document.getElementById('app').addEventListener('keydown',e=>{const b=e.target.closest('.glosslink');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTerm(b.dataset.term)}});
 function openTerm(term){const modal=document.getElementById('glossary'),search=document.getElementById('glossSearch');search.value=term;document.getElementById('openGloss').click();const card=document.querySelector('.glossentry');if(card)card.classList.add('focused');}
})();
</script></body></html>
